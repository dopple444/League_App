map $http_x_request_id $league_request_id {
  default $http_x_request_id;
  '' $request_id;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  client_max_body_size 10m;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'nonce-$request_id'; connect-src 'self' ws: wss:" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}\n';
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $league_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://api:3001;
  }

  location ^~ /_next/static/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $league_request_id;
    proxy_pass http://web:3000;
  }

  location / {
    proxy_http_version 1.1;
    # Next's App Router emits required inline bootstrap and streaming scripts.
    # Keep arbitrary inline scripts blocked while granting each response a fresh nonce.
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $league_request_id;
    sub_filter_once off;
    sub_filter '<script' '<script nonce="$request_id"';
    proxy_pass http://web:3000;
  }
}
