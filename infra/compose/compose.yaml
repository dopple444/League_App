name: league-app

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  gateway:
    <<: *service-defaults
    image: nginxinc/nginx-unprivileged:1.30.4-alpine@sha256:44e36330f74d4f3a1d4e222acca9e23b401fb87811a7597024502bb759c4dd49
    labels:
      org.league-app.lan-test-enabled: ${GATEWAY_LAN_TEST_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - ${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    <<: *service-defaults
    image: league-app/web:local
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@league/web'
    environment:
      API_INTERNAL_URL: http://api:3001
      FEATURED_PUBLIC_LEAGUE_SLUG: ${FEATURED_PUBLIC_LEAGUE_SLUG:-}
      FEATURED_PUBLIC_ORGANIZATION_SLUG: ${FEATURED_PUBLIC_ORGANIZATION_SLUG:-}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ''
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - edge
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  api:
    <<: *service-defaults
    image: league-app/api:local
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@league/api'
    environment:
      API_PORT: 3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run pnpm env:init}
      BETTER_AUTH_URL: http://${GATEWAY_HOST:-localhost}:${GATEWAY_PORT:-8080}
      PRIVILEGED_MFA_REQUIRED: ${PRIVILEGED_MFA_REQUIRED:-false}
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Run pnpm env:init}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOBILE_ORIGIN: ${MOBILE_ORIGIN:-league-companion://}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379/0
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run pnpm env:init}
      S3_BUCKET: ${S3_BUCKET:-league-local}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run pnpm env:init}
      SCHEDULER_URL: http://scheduler:8000
      WEB_ORIGIN: http://${GATEWAY_HOST:-localhost}:${GATEWAY_PORT:-8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - '3001'
    networks:
      - edge
      - core
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  migrate:
    image: league-app/api:local
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@league/api'
    command: [pnpm, --filter, '@league/database', db:migrate]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run pnpm env:init}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    networks:
      - core

  worker:
    <<: *service-defaults
    image: league-app/worker:local
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@league/worker'
    environment:
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Run pnpm env:init}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-25}
      OUTBOX_DISCOVERY_LIMIT: ${OUTBOX_DISCOVERY_LIMIT:-100}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-60000}
      OUTBOX_MAX_DISPATCH_ATTEMPTS: ${OUTBOX_MAX_DISPATCH_ATTEMPTS:-10}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      REDIS_URL: redis://redis:6379/0
      WORKER_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3002'
    networks:
      - core
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  scheduler:
    <<: *service-defaults
    image: league-app/scheduler:local
    build:
      context: ../..
      dockerfile: infra/docker/scheduler.Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '8000'
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - core

  postgres:
    <<: *service-defaults
    image: league-app/postgres:local
    build:
      context: ../..
      dockerfile: infra/docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-league_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
      POSTGRES_USER: ${POSTGRES_USER:-league_migrator}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Run pnpm env:init}
      TEST_DATABASE_PASSWORD: ${TEST_DATABASE_PASSWORD:?Run pnpm env:init}
    ports:
      - 127.0.0.1:54320:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/010-league-roles.sh:ro
    networks:
      - core
      - host-access
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:8.4.6-alpine3.22@sha256:12da49daa000c2be4d55118574f889c8cc298140ecf343d04f345c818f227823
    command: [redis-server, --appendonly, 'yes', --save, '60', '1', --loglevel, warning]
    ports:
      - 127.0.0.1:63790:6379
    volumes:
      - redis-data:/data
    networks:
      - core
      - host-access
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm env:init}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-league-local-admin}
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio-data:/data
    networks:
      - core
      - host-access
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null;
        mc mb --ignore-existing "local/$${S3_BUCKET}" >/dev/null;
        mc anonymous set none "local/$${S3_BUCKET}" >/dev/null
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm env:init}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-league-local-admin}
      S3_BUCKET: ${S3_BUCKET:-league-local}
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    networks:
      - core

  mailpit:
    <<: *service-defaults
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    volumes:
      - mailpit-data:/data
    networks:
      - core
      - host-access

networks:
  edge:
  core:
    internal: true
  host-access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'

volumes:
  mailpit-data:
  minio-data:
  postgres-data:
  redis-data:
