name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  CI_SYNTHETIC_BETTER_AUTH_SECRET: ci-synthetic-better-auth-secret-only
  CI_SYNTHETIC_DEMO_ADMIN_PASSWORD: ci-synthetic-demo-admin-password-only
  CI_SYNTHETIC_MINIO_PASSWORD: ci-synthetic-minio-password-only
  CI_SYNTHETIC_POSTGRES_PASSWORD: ci-synthetic-postgres-password-only
  CI_SYNTHETIC_RUNTIME_DATABASE_PASSWORD: ci-synthetic-runtime-password-only
  CI_SYNTHETIC_TEST_DATABASE_PASSWORD: ci-synthetic-test-password-only
  LEAGUE_STRICT_TOOLCHAIN: '1'

jobs:
  quality:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Activate pinned pnpm
        run: corepack enable && corepack install --global pnpm@11.22.0
      - name: Create explicit synthetic CI environment
        run: pnpm env:init:ci
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: pnpm scheduler:sync --frozen
      - name: Verify toolchain and configuration
        run: pnpm toolchain:check && pnpm env:check && pnpm compose:config && pnpm import:check
      - name: Verify formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify generated contracts
        run: pnpm contracts:check
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run mobile tests
        run: pnpm test:mobile
      - name: Build deployables
        run: pnpm build

  integration:
    name: Tenant, authorization, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack install --global pnpm@11.22.0
      - name: Create explicit synthetic CI environment
        run: pnpm env:init:ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser test runtime
        run: pnpm --filter @league/web exec playwright install --with-deps chromium
      - name: Start private local stack
        id: integration_stack
        run: pnpm stack:up
      - name: Diagnose failed application containers
        if: failure() && steps.integration_stack.outcome == 'failure'
        shell: bash
        run: |
          compose=(docker compose --env-file .env -f infra/compose/compose.yaml)

          # Register synthetic secrets with the runner before emitting service logs.
          # Do not print Compose configuration or container environments here.
          if [[ -f .env ]]; then
            while IFS='=' read -r name value; do
              case "$name" in
                *DATABASE_URL*|*PASSWORD*|*SECRET*|*TOKEN*|*KEY*)
                  value="${value%$'\r'}"
                  if [[ -n "$value" ]]; then
                    echo "::add-mask::$value"
                  fi
                  ;;
              esac
            done < .env
          fi

          echo "::group::Compose service state"
          "${compose[@]}" ps --all || true
          echo "::endgroup::"

          for service in web api worker scheduler migrate; do
            should_log=false
            while IFS= read -r container_id; do
              [[ -n "$container_id" ]] || continue
              state="$(docker inspect --format '{{.State.Status}}' "$container_id" 2>/dev/null || echo unknown)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" 2>/dev/null || echo unknown)"
              printf '%s container %s: state=%s health=%s\n' "$service" "$container_id" "$state" "$health"
              if [[ "$state" != running || "$health" != healthy ]]; then
                should_log=true
              fi
            done < <("${compose[@]}" ps --all --quiet "$service" 2>/dev/null || true)

            if [[ "$should_log" == true ]]; then
              echo "::group::Bounded ${service} logs"
              "${compose[@]}" logs --no-color --timestamps --tail 120 "$service" 2>&1 || true
              echo "::endgroup::"
            fi
          done
      - name: Verify migrations and seed
        run: pnpm db:migrate:verify && pnpm db:seed:verify
      - name: Run API and relay security suites
        run: pnpm test:integration && pnpm test:tenancy && pnpm test:authz && pnpm test:outbox
      - name: Run browser and accessibility suites
        run: pnpm test:e2e && pnpm test:a11y
      - name: Verify backup and service health
        run: pnpm db:restore:verify && pnpm stack:smoke
      - name: Stop local stack
        if: always()
        run: pnpm stack:down

  security:
    name: Dependency and container security
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Activate pinned pnpm
        run: corepack enable && corepack install --global pnpm@11.22.0
      - name: Create explicit synthetic CI environment
        run: pnpm env:init:ci
      - name: Install dependencies
        id: security_install
        run: pnpm install --frozen-lockfile && pnpm scheduler:sync --frozen
      - name: Build Compose images
        run: pnpm stack:up
      - name: Scan Compose images
        run: pnpm security:containers
      # Keep the dependency gate independent of the container scan result.
      - name: Audit dependencies
        if: always() && steps.security_install.outcome == 'success'
        run: pnpm security:dependencies
      - name: Stop local stack
        if: always()
        run: pnpm stack:down

  required:
    name: Milestones 0-1 required result
    if: always()
    needs: [quality, integration, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          failed=0

          report_lane() {
            local lane="$1"
            local result="$2"
            printf '%s: %s\n' "$lane" "$result"
            if [[ "$result" != success ]]; then
              echo "::error title=CI lane did not succeed::${lane} concluded ${result}."
              return 1
            fi
          }

          report_lane "Static checks and unit tests" "$QUALITY_RESULT" || failed=1
          report_lane "Tenant, authorization, and browser checks" "$INTEGRATION_RESULT" || failed=1
          report_lane "Dependency and container security" "$SECURITY_RESULT" || failed=1

          exit "$failed"
