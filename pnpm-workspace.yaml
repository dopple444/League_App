packages:
  - apps/*
  - packages/*

overrides:
  '@prisma/config>deepmerge-ts': 8.0.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@league/*'
